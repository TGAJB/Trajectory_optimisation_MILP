# =============================================================================
# config.yaml - all problem data for the MILP trajectory optimiser
# Ref: Richards (2002) MSc thesis, Sec 2.3 / Richards et al. JGCD 25(4) 2002
#
# TODO:
#   [ ] Fill in the general settings (dynamics, horizon, limits, big-M, solver)
#   [ ] Define vehicle 1 start/end states (single-vehicle mode uses only this one)
#   [ ] Add extra vehicles for multi-vehicle mode
#   [ ] Define the obstacle boxes for one_obstacle and multi_obstacle
#   [ ] Make sure start/end points lie outside every (inflated) obstacle
#   [ ] Pick big-M just above the largest coordinate difference (not 1e6)
#   [ ] Later: set vehicle_avoidance.safety_distance and plume.length/half_width
# =============================================================================

general:
  dynamics: double_integrator     # double_integrator | hill
  dims: 2                         # N = 2 or 3
  T: 40                           # number of time steps
  dt: 15.0                        # time-step length [s] -> 600 s total
  omega: null                     # orbital rate [rad/s] (hill only)
  mass: 5                         # [kg]
  u_max: 1.0e-3                   # thrust limit per axis [N] (write 1.0e-3, not 1e-3: YAML reads that as text)
  x_max: [20, 20, 0.1, 0.1]       # state limits [x, y, vx, vy]; peak speed here is about 0.02 m/s
  big_M: 50                       # > largest position difference (positions within +-20 -> 40)
  obstacle_margin: 0.1            # inflation to limit between-step corner cutting (0.1 removes it at T=40, dt=15)
  solver:
    time_limit: null              # [s]
    mip_gap: null

vehicles:                         # state = [positions..., velocities...]
  - name: v1
    start: [0,0,0,0] #[x,y,vx,vy]
    end: [10,0,0,0]
  # Extra vehicles (multi_vehicle only)
  - name: v2                      # convoy: follows 2 m behind v1, so v1's acceleration burn
    start: [-2, 0, 0, 0]          # blows straight at v2 and v2's braking burn blows at v1
    end:   [8, 0, 0, 0]           # -> this is the pair that makes the plume constraints matter
  - name: v3                      # bottom to top at x = 5, through the gap between the obstacles
    start: [5, -4, 0, 0]
    end:   [5, 4, 0, 0]

vehicle_avoidance:                # used only when multi_vehicle is true
  safety_distance: [1, 1]         # r_n per axis: vehicles stay >= 1 m apart in x OR in y

plume:                            # constraints only when plumes is true (the animation always draws it)
  length: 3.0                     # P: how far the exhaust reaches behind a thruster [m]
  half_width: 0.5                 # W: half the plume width [m]   (big_M must stay > 40 + P)

scenarios:                        # each obstacle: {lower: [...], upper: [...]}
  no_obstacle: []
  one_obstacle: 
  - {lower: [2,-1], upper: [4,1]} # '-' starts a list item and we write bottom left and top right corner
  multi_obstacle:
  - {lower: [2, -1], upper: [4, 1]}        # A: blocks the straight line (same box as one_obstacle)
  - {lower: [5.5, -3], upper: [6.5, -0.5]} # B: below the line, blocks a wide detour under A
  - {lower: [5.5, 0.5], upper: [6.5, 3]}   # C: above the line, B and C leave a 1 m gap around y = 0
  u_trap:                                  # start inside a U-shaped cup that opens towards -x:
  - {lower: [0.8, -1.5], upper: [1.2, 1.5]}    # front wall: blocks the way to the goal
  - {lower: [-0.5, 1.1], upper: [1.2, 1.5]}    # top wall
  - {lower: [-0.5, -1.5], upper: [1.2, -1.1]}  # bottom wall -> only way out is backwards (x < -0.5)
  # (a bigger cup is infeasible: with 1 mN on 5 kg there is not enough time in 600 s)

toggles:                          # defaults, overridable from the command line
  scenario: multi_obstacle        # no_obstacle | one_obstacle | multi_obstacle | u_trap
  multi_vehicle: True
  plumes: True                   # ignored (with warning) if multi_vehicle is false
